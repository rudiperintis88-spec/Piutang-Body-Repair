<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piutang Body Repair — PT Perintis Perkasa</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#12151d; --panel-2:#171b26; --border:#232838;
    --ink:#f2efe9; --muted:#8b93a7; --muted-2:#5f6785;
    --green:#5fd889; --amber:#e8b055; --blue:#7a8ef2; --red:#e5636b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',Inter,-apple-system,sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:48px 32px 80px;}
  .topline{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:8px;}
  .brand{color:var(--muted);font-size:15px;margin:0 0 8px;}
  h1{font-family:Georgia,serif;font-weight:600;font-size:36px;margin:0 0 6px;letter-spacing:-0.01em;}
  .sub{color:var(--muted);font-size:13.5px;}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .btn{
    background:#2a4bd6;color:#fff;border:none;border-radius:8px;padding:9px 16px;
    font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:#3457e0;}
  .btn.secondary{background:var(--panel-2);border:1px solid var(--border);color:var(--ink);}
  .status{font-size:12.5px;color:var(--muted);}
  .status b{color:var(--ink);}
  .status.err{color:var(--red);}
  label.toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;}
  hr{border:none;border-top:1px solid var(--border);margin:24px 0;}
  .total-card{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:26px 30px;margin-bottom:24px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
  }
  .total-card .amount{font-family:Georgia,serif;font-weight:600;font-size:38px;}
  .total-card .label{color:var(--muted);font-size:13.5px;margin-bottom:6px;}
  .search-bar{margin-bottom:18px;}
  #search{
    width:100%;background:var(--panel);border:1px solid var(--border);
    color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;
  }
  #search:focus{outline:none;border-color:var(--blue);}
  .list{display:flex;flex-direction:column;gap:10px;}
  .debtor{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .debtor-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;cursor:pointer;gap:16px;}
  .debtor-head:hover{background:var(--panel-2);}
  .debtor-name{font-weight:600;font-size:15px;}
  .debtor-name .cab{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:600;color:var(--muted-2);background:#1b2030;padding:2px 8px;border-radius:20px;}
  .debtor-meta{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .debtor-right{display:flex;align-items:center;gap:14px;}
  .debtor-total{font-family:Georgia,serif;font-size:19px;text-align:right;}
  .chevron{color:var(--muted-2);transition:transform 0.2s;}
  .debtor.open .chevron{transform:rotate(90deg);}
  .debtor-body{display:none;padding:0 20px 20px;border-top:1px solid var(--border);}
  .debtor.open .debtor-body{display:block;}
  .months-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
  .month-pill{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12.5px;}
  .month-pill b{display:block;font-family:Georgia,serif;font-size:15px;margin-top:2px;}
  table{width:100%;border-collapse:collapse;margin-top:8px;}
  th{text-align:left;font-size:11.5px;color:var(--muted-2);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--border);}
  th.num,td.num{text-align:right;}
  td{padding:9px 6px;border-bottom:1px solid var(--border);font-size:13px;}
  tr:last-child td{border-bottom:none;}
  .bar-title{font-size:12px;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:0.04em;}
  .banner{background:#241417;border:1px solid #3a1c22;color:var(--red);border-radius:10px;padding:14px 18px;font-size:13px;margin-bottom:20px;display:none;}
  .loading{color:var(--muted);font-size:13px;padding:40px 0;text-align:center;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted-2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (max-width:760px){
    .aging-grid{grid-template-columns:repeat(2,1fr) !important;}
  }
  .tab-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    border-radius:9px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{background:var(--blue);color:#0b0e14;border-color:var(--blue);}
  .cabang-group{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
  .cabang-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;cursor:pointer;gap:16px;}
  .cabang-head:hover{background:var(--panel-2);}
  .cabang-title{font-weight:700;font-size:16px;}
  .cabang-meta{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .cabang-total{font-family:Georgia,serif;font-size:21px;text-align:right;}
  .cabang-body{display:none;padding:0 20px 18px;border-top:1px solid var(--border);}
  .cabang-group.open .cabang-body{display:block;}
  .cabang-group.open .chevron{transform:rotate(90deg);}
  .cabang-body .list{margin-top:12px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topline">
    <div>
      <p class="brand">PT Perintis Perkasa, Medan</p>
      <h1>Piutang Body Repair</h1>
      <p class="sub" id="opname-title" style="margin-bottom:2px;"></p>
      <p class="sub" id="source-sub">Sumber: Laporan Piutang Body Repair</p>
    </div>
    <div class="controls">
      <label class="toggle"><input type="checkbox" id="auto-toggle" checked> Auto-refresh 60 dtk</label>
      <button class="btn" id="refresh-btn">&#8635; Refresh sekarang</button>
    </div>
  </div>
  <div class="status" id="status">Memuat data...</div>

  <div class="banner" id="error-banner"></div>

  <hr>

  <div class="tabs" id="tabs" style="display:none; gap:8px; margin-bottom:18px;">
    <button class="tab-btn active" data-tab="debitur">Per Debitur</button>
    <button class="tab-btn" data-tab="cabang">Per Asuransi</button>
  </div>

  <div id="content">
    <div class="loading"><span class="spin"></span>Mengambil data dari Google Sheets...</div>
  </div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTM7G5Mv4eC4DN3u_xkvUBCu3LYgZxMIEq0lY9QOKykZudX02ANnM0-2GwxtQ28gJjEEzThOWWj__Az/pub?gid=0&single=true&output=csv";

let autoTimer = null;

function formatRp(n) {
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

// Robust CSV parser (handles quoted fields with commas)
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

function parseAmount(s) {
  if (!s) return 0;
  s = s.trim().replace(/\./g, '');
  const n = parseInt(s, 10);
  return isNaN(n) ? 0 : n;
}

function parseDateDDMMYYYY(s) {
  if (!s) return null;
  const m = s.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  return { day: parseInt(m[1]), month: parseInt(m[2]), year: parseInt(m[3]) };
}

const MONTH_NAMES = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTH_FULL_ID = ['','januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];

function extractPerDate(title) {
  if (!title) return '';
  const re = new RegExp('(\\d{1,2})\\s+(' + MONTH_FULL_ID.slice(1).join('|') + ')\\s+(\\d{4})', 'i');
  const m = title.match(re);
  if (!m) return '';
  const day = m[1].padStart(2, '0');
  const monthIdx = MONTH_FULL_ID.indexOf(m[2].toLowerCase());
  const monthAbbr = monthIdx > 0 ? MONTH_NAMES[monthIdx] : m[2];
  const year = m[3];
  return 'Per: ' + day + '-' + monthAbbr + '-' + year;
}

function processRows(rows) {
  // find header row: first cell === 'No'
  let headerIdx = -1;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i][0] && rows[i][0].trim() === 'No') { headerIdx = i; break; }
  }
  if (headerIdx === -1) throw new Error("Format kolom tidak dikenali (header 'No' tidak ditemukan)");

  // find report title row (any row before header mentioning "piutang", excluding "BERITA ACARA")
  let reportTitle = '';
  for (let i = 0; i < headerIdx; i++) {
    const cell = (rows[i][0] || '').trim();
    if (!cell) continue;
    if (cell.toLowerCase() === 'berita acara') continue;
    if (cell.toLowerCase().includes('piutang')) { reportTitle = cell; break; }
  }

  const dataRows = [];
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0] || !/^\d+$/.test(r[0].trim())) continue;
    dataRows.push(r);
  }

  const byDebitur = {};
  let grandTotal = 0;

  const nameMap = {
    'PT . ASURANSI MSIG INDONESIA': 'PT. ASURANSI MSIG INDONESIA',
    'PERINTIS PERKASA,PT': 'PERINTIS PERKASA, PT',
  };

  dataRows.forEach(r => {
    while (r.length < 15) r.push('');
    let nama = (r[2] || '').trim();
    nama = nameMap[nama] || nama;
    const nopol = r[3] || '';
    const faktur = r[4] || '';
    const tgljto = (r[6] || '').trim();
    const jumlah = parseAmount(r[7]);
    const sa = r[10] || '';
    const hari = r[11] || '';
    const cabang = r[14] || '';
    const dt = parseDateDDMMYYYY(tgljto);

    if (!byDebitur[nama]) {
      byDebitur[nama] = { name: nama, total: 0, count: 0, invoices: [], monthsMap: {}, cabang: cabang };
    }
    const d = byDebitur[nama];
    d.total += jumlah;
    d.count += 1;
    d.invoices.push({ faktur, tgljto, nopol, sa, jumlah, hari, cabang });
    grandTotal += jumlah;

    let key = 'unknown';
    if (dt) key = dt.year + '-' + String(dt.month).padStart(2, '0');
    d.monthsMap[key] = (d.monthsMap[key] || 0) + jumlah;
  });

  const debtors = Object.values(byDebitur).map(d => {
    const months = Object.keys(d.monthsMap).sort().map(key => {
      let label;
      if (key === 'unknown') label = 'Lainnya';
      else {
        const [y, m] = key.split('-');
        label = MONTH_NAMES[parseInt(m)] + ' ' + y;
      }
      return { period: key, label, total: d.monthsMap[key] };
    });
    return { name: d.name, total: d.total, count: d.count, cabang: d.cabang, invoices: d.invoices, months };
  }).sort((a, b) => b.total - a.total);

  return { grand_total: grandTotal, grand_count: dataRows.length, debtors, report_title: reportTitle };
}

let lastData = null;
let currentTab = 'debitur';

function createDebtorEl(d) {
  const el = document.createElement('div');
  el.className = 'debtor';
  el.dataset.name = d.name.toLowerCase();

  const head = document.createElement('div');
  head.className = 'debtor-head';
  head.innerHTML = `
    <div>
      <div class="debtor-name">${d.name}<span class="cab">${d.cabang || '-'}</span></div>
      <div class="debtor-meta">${d.count} faktur</div>
    </div>
    <div class="debtor-right">
      <div class="debtor-total">${formatRp(d.total)}</div>
      <div class="chevron">&#9656;</div>
    </div>
  `;
  head.onclick = () => el.classList.toggle('open');

  const body = document.createElement('div');
  body.className = 'debtor-body';

  let monthsHtml = '<div class="bar-title">Total Piutang</div><div class="months-row"><div class="month-pill" style="font-size:14px;">Total keseluruhan<b style="font-size:20px;">' + formatRp(d.total) + '</b></div></div>';
  monthsHtml += '<div class="bar-title">Rincian per Bulan (Tgl Jatuh Tempo)</div><div class="months-row">';
  d.months.forEach(m => {
    monthsHtml += `<div class="month-pill">${m.label}<b>${formatRp(m.total)}</b></div>`;
  });
  monthsHtml += '</div>';

  let invHtml = '<div class="bar-title">Daftar Faktur (' + d.invoices.length + ')</div><table><thead><tr><th>No Faktur</th><th>Tgl Jto</th><th>No Polisi</th><th>SA</th><th class="num">Hari</th><th class="num">Jumlah</th></tr></thead><tbody>';
  d.invoices.forEach(inv => {
    invHtml += `<tr><td>${inv.faktur}</td><td>${inv.tgljto}</td><td>${inv.nopol || '-'}</td><td>${inv.sa}</td><td class="num">${inv.hari || '-'}</td><td class="num">${formatRp(inv.jumlah)}</td></tr>`;
  });
  invHtml += '</tbody></table>';

  body.innerHTML = monthsHtml + invHtml;
  el.appendChild(head);
  el.appendChild(body);
  return el;
}

function renderDebiturTab(container, data) {
  const searchBar = document.createElement('div');
  searchBar.className = 'search-bar';
  searchBar.innerHTML = '<input id="search" type="text" placeholder="Cari nama debitur...">';
  container.appendChild(searchBar);

  const list = document.createElement('div');
  list.className = 'list';
  data.debtors.forEach(d => list.appendChild(createDebtorEl(d)));
  container.appendChild(list);

  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.debtor').forEach(el => {
      el.style.display = el.dataset.name.includes(q) ? '' : 'none';
    });
  });
}

function renderCabangTab(container, data) {
  const byCabang = {};
  data.debtors.forEach(d => {
    const key = d.cabang || 'Lainnya';
    if (!byCabang[key]) byCabang[key] = { name: key, total: 0, count: 0, debtors: [] };
    byCabang[key].total += d.total;
    byCabang[key].count += d.count;
    byCabang[key].debtors.push(d);
  });
  const groups = Object.values(byCabang).sort((a, b) => b.total - a.total);

  const searchBar = document.createElement('div');
  searchBar.className = 'search-bar';
  searchBar.innerHTML = '<input id="search" type="text" placeholder="Cari nama cabang atau debitur...">';
  container.appendChild(searchBar);

  const list = document.createElement('div');
  list.className = 'list';

  groups.forEach(g => {
    const el = document.createElement('div');
    el.className = 'cabang-group';
    el.dataset.name = g.name.toLowerCase();

    const head = document.createElement('div');
    head.className = 'cabang-head';
    head.innerHTML = `
      <div>
        <div class="cabang-title">${g.name}</div>
        <div class="cabang-meta">${g.debtors.length} debitur &middot; ${g.count} faktur</div>
      </div>
      <div class="debtor-right">
        <div class="cabang-total">${formatRp(g.total)}</div>
        <div class="chevron">&#9656;</div>
      </div>
    `;
    head.onclick = () => el.classList.toggle('open');

    const body = document.createElement('div');
    body.className = 'cabang-body';
    const innerList = document.createElement('div');
    innerList.className = 'list';
    g.debtors.forEach(d => {
      const de = createDebtorEl(d);
      de.dataset.name = (g.name + ' ' + d.name).toLowerCase();
      innerList.appendChild(de);
    });
    body.appendChild(innerList);

    el.appendChild(head);
    el.appendChild(body);
    list.appendChild(el);
  });

  container.appendChild(list);

  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.cabang-group').forEach(el => {
      el.style.display = el.dataset.name.includes(q) ? '' : 'none';
    });
  });
}

function computeAgingBuckets(data) {
  const buckets = {
    b1: { label: '1-7 hari', min: 1, max: 7, color: 'var(--green)', total: 0, count: 0 },
    b2: { label: '8-14 hari', min: 8, max: 14, color: 'var(--amber)', total: 0, count: 0 },
    b3: { label: '15-26 hari', min: 15, max: 26, color: '#e0904a', total: 0, count: 0 },
    b4: { label: '> 26 hari', min: 27, max: Infinity, color: 'var(--red)', total: 0, count: 0, warn: true },
  };
  data.debtors.forEach(d => {
    d.invoices.forEach(inv => {
      const h = parseInt(inv.hari, 10);
      if (isNaN(h)) return;
      for (const key in buckets) {
        const b = buckets[key];
        if (h >= b.min && h <= b.max) {
          b.total += inv.jumlah;
          b.count += 1;
          break;
        }
      }
    });
  });
  return buckets;
}

function renderAgingCards(data) {
  const buckets = computeAgingBuckets(data);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;';
  wrap.className = 'aging-grid';
  Object.values(buckets).forEach(b => {
    const card = document.createElement('div');
    card.style.cssText = `background:${b.warn ? '#241417' : 'var(--panel)'};border:1px solid ${b.warn ? '#3a1c22' : 'var(--border)'};border-radius:14px;padding:18px 20px;`;
    card.innerHTML = `
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">
        <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${b.color};margin-right:6px;"></span>${b.label}
      </div>
      <div style="font-family:Georgia,serif;font-size:22px;font-weight:600;color:${b.warn ? 'var(--red)' : 'var(--ink)'};">${formatRp(b.total)}</div>
      <div style="font-size:12px;color:${b.warn ? 'var(--red)' : 'var(--muted-2)'};margin-top:4px;">${b.count} faktur${b.warn ? ' &middot; prioritas tagih' : ''}</div>
    `;
    wrap.appendChild(card);
  });
  return wrap;
}

function render(data) {
  lastData = data;
  const content = document.getElementById('content');
  content.innerHTML = '';

  const totalCard = document.createElement('div');
  totalCard.className = 'total-card';
  totalCard.innerHTML = `
    <div>
      <p class="label">Total piutang berjalan</p>
      <p class="amount">${formatRp(data.grand_total)}</p>
    </div>
    <div style="text-align:right;">
      <p class="label">Jumlah faktur &middot; debitur</p>
      <p class="amount" style="font-size:22px;">${data.grand_count} faktur / ${data.debtors.length} debitur</p>
    </div>
  `;
  content.appendChild(totalCard);
  content.appendChild(renderAgingCards(data));

  const sourceSub = document.getElementById('source-sub');
  if (sourceSub) sourceSub.textContent = 'Sumber: Laporan Piutang Body Repair (' + data.grand_count + ' faktur)';

  const opnameTitle = document.getElementById('opname-title');
  if (opnameTitle) opnameTitle.textContent = extractPerDate(data.report_title) || data.report_title || '';

  document.getElementById('tabs').style.display = 'flex';

  if (currentTab === 'debitur') {
    renderDebiturTab(content, data);
  } else {
    renderCabangTab(content, data);
  }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    if (lastData) render(lastData);
  });
});

async function loadData() {
  const statusEl = document.getElementById('status');
  const errBanner = document.getElementById('error-banner');
  statusEl.innerHTML = '<span class="spin"></span>Mengambil data terbaru...';
  errBanner.style.display = 'none';

  try {
    const res = await fetch(CSV_URL + '&_ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    const data = processRows(rows);
    render(data);

    const now = new Date();
    statusEl.classList.remove('err');
    statusEl.innerHTML = 'Terakhir disinkron: <b>' + now.toLocaleString('id-ID') + '</b>';
  } catch (err) {
    statusEl.classList.add('err');
    statusEl.textContent = 'Gagal memuat data.';
    errBanner.style.display = 'block';
    errBanner.textContent = 'Error: ' + err.message + '. Pastikan file ini dibuka lewat browser (bukan lewat pratinjau claude.ai), dan link CSV masih publik/valid.';
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadData);

const autoToggle = document.getElementById('auto-toggle');
function setupAutoRefresh() {
  if (autoTimer) clearInterval(autoTimer);
  if (autoToggle.checked) {
    autoTimer = setInterval(loadData, 60000);
  }
}
autoToggle.addEventListener('change', setupAutoRefresh);

loadData();
setupAutoRefresh();
</script>
</body>
</html>
